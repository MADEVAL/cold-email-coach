name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill structure
        run: python tests/validate_skill.py
      - name: Lint fixtures
        run: |
          python skills/cold-email-coach/scripts/email_lint.py tests/fixtures/good-email.txt
          if python skills/cold-email-coach/scripts/email_lint.py tests/fixtures/bad-email.txt; then
            echo "bad fixture unexpectedly passed"
            exit 1
          fi
